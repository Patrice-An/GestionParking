# Unique identifier for your project
sonar.projectKey=my-manual-java-project
sonar.projectName=My Manual Java Project
sonar.projectVersion=1.0

# Path to the source directories (usually 'src')
sonar.sources=src

# Path to the compiled .class files (IMPORTANT for Java)
sonar.java.binaries=bin

# Language
sonar.language=java
sonar.sourceEncoding=UTF-8